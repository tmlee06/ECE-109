<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>ECE 109 · Probability Path</title>
<style>
:root{--bg:#0e1014;--panel:#161a21;--panel2:#1c2129;--line:#2a303b;--text:#e8eaf0;--muted:#8b92a3;--dim:#4b5262;--acc:#4fd1b5;--accd:rgba(79,209,181,.13);--slate:#8fa3c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:rgba(14,16,20,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;flex:1;line-height:1.2}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pill{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:650;font-size:14px;white-space:nowrap}
.pill svg{width:16px;height:16px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.iconbtn svg{width:18px;height:18px}
.main{padding:16px 16px 40px;flex:1}
.today{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.today .dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
.today.done .dot{background:var(--acc)}
.today p{margin:0;font-size:14px;color:var(--muted)}
.today b{color:var(--text);font-weight:650}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.tile{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left;min-height:72px}
.tile b{display:block;font-size:15px}
.tile span{font-size:13px;color:var(--muted)}
.tile:active{transform:scale(.98)}
.track{margin:10px 0 26px}
.trackhead{display:flex;align-items:baseline;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--line)}
.trackhead h2{margin:0;font-size:18px}
.trackhead small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:2px}
.trackhead .count{color:var(--muted);font-size:13px}
.path{position:relative;margin-top:8px}
.path svg.conn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:150px;margin-left:-75px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node .disc{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:18px;background:var(--panel2);border:2px solid var(--line);color:var(--muted);position:relative}
.node .disc svg{width:24px;height:24px}
.node.done .disc{background:var(--acc);border-color:var(--acc);color:#06231d}
.node.current .disc,.node.open .disc{background:var(--panel);border:3px solid var(--acc);color:var(--acc)}
.node.current .disc::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--acc);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.75;transform:scale(.92)}100%{opacity:0;transform:scale(1.3)}}
.node.locked .disc{color:var(--dim)}
.node.soon .disc{border-style:dashed;color:var(--dim);background:transparent}
.node .lbl{font-size:12.5px;text-align:center;color:var(--muted);line-height:1.25}
.node.done .lbl,.node.current .lbl,.node.open .lbl{color:var(--text)}
.node.soon .lbl{color:var(--dim)}
.node button{display:flex;flex-direction:column;align-items:center;gap:6px}
.node button:disabled{cursor:default}
.node .tag{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}

/* lesson */
.lhead{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 16px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s ease}
.lbody{padding:4px 16px 20px;flex:1}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--acc);font-weight:700;margin:6px 0 10px}
.viz{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;touch-action:manipulation}
.viz canvas{display:block}
.viz+.viz{margin-top:10px}
h3.ttl{margin:16px 0 6px;font-size:19px}
.txt{color:#c9ced8;margin:6px 0 0;font-size:15.5px}
.prompt{font-size:17px;font-weight:600;margin:14px 0 12px;line-height:1.4}
.cap{font-size:14px;color:var(--muted);margin:8px 2px 0;min-height:21px}
.cap b{color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 2px 0;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:9px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:550;min-height:40px}
.chip.on{background:var(--accd);border-color:var(--acc);color:var(--acc)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cbtn{padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:650;font-size:14px;min-height:44px}
.cbtn.pri{background:var(--acc);color:#06231d;border-color:var(--acc)}
.sl{margin-top:12px}
.sl label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:4px}
.sl label b{color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.opts{display:grid;gap:10px}
.opts.pics{grid-template-columns:repeat(3,1fr)}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:16px;font-weight:550;min-height:54px;transition:border-color .15s,background .15s}
.opts.pics .opt{padding:6px;text-align:center}
.opts.pics .opt .viz{border:0;background:transparent}
.opts.pics .opt small{display:block;font-size:12px;color:var(--muted);padding:2px 0 4px}
.opt.sel{border-color:var(--text);background:var(--panel2)}
.opt.right{border-color:var(--acc);background:var(--accd)}
.opt.picked{border-color:var(--dim);opacity:.7}
.opt:disabled{cursor:default}
.lfoot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18px);padding:22px 16px calc(16px + env(safe-area-inset-bottom))}
.fb{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);font-size:15px;animation:up .25s ease}
.fb.good{border-color:var(--acc)}
.fb h4{margin:0 0 4px;font-size:15px}
.fb.good h4{color:var(--acc)}
.fb p{margin:0;color:#c9ced8}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-weight:750;font-size:16px;background:var(--acc);color:#06231d;text-align:center;min-height:54px}
.btn:disabled{background:var(--panel2);color:var(--dim)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.formula{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.formula .f{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:20px;color:var(--text);overflow-x:auto;white-space:nowrap;padding:4px 0}
.formula .n{font-size:14px;color:var(--muted);margin-top:4px}
/* done screen */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center}
.done svg.check{width:110px;height:110px}
.done .ring{stroke:var(--acc);stroke-width:5;fill:none;stroke-dasharray:302;stroke-dashoffset:302;animation:draw .6s ease forwards}
.done .tick{stroke:var(--acc);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .35s .55s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{margin:18px 0 6px;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:20px 0 26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:22px;color:var(--acc)}
.stat span{font-size:12px;color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px}
.sheet .rowt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.sheet .rowt p{margin:0;font-size:13px;color:var(--muted)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.sw.on{background:var(--accd);border-color:var(--acc)}
.sw.on::after{left:23px;background:var(--acc)}
.labsec{margin-bottom:30px}
.labsec h3{margin:0 0 4px}
.labsec p{margin:0 0 10px;color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ core helpers ============ */
const TAU=Math.PI*2, FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif';
const C={bg:'#0e1014',panel:'#161a21',text:'#e8eaf0',muted:'#8b92a3',dim:'#4b5262',grid:'#232934',line:'#2f3643',acc:'#4fd1b5',b:'#8fa3c7',ink:'#06231d'};
const acc=a=>`rgba(79,209,181,${a})`, slate=a=>`rgba(143,163,199,${a})`;
const app=document.getElementById('app');
let live=[];
function cleanup(){live.forEach(f=>{try{f()}catch(e){}});live=[];}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function T(ctx,s,x,y,o={}){ctx.save();ctx.font=`${o.w||500} ${o.s||13}px ${FONT}`;ctx.fillStyle=o.c||C.text;ctx.textAlign=o.a||'center';ctx.textBaseline=o.bl||'middle';ctx.fillText(String(s),x,y);ctx.restore();}
function rr(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));else ctx.rect(x,y,w,h);}
function hatch(ctx,x,y,w,h,col){ctx.save();ctx.strokeStyle=col||'rgba(14,16,20,.5)';ctx.lineWidth=1.6;ctx.beginPath();for(let k=-h;k<w;k+=7){ctx.moveTo(x+k,y+h);ctx.lineTo(x+k+h,y);}ctx.stroke();ctx.restore();}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const fmt=(v,d=2)=>{let s=(+v).toFixed(d);if(s.includes('.'))s=s.replace(/\.?0+$/,'');return(s==='-0'||s==='')?'0':s;};

function mkCanvas(host,h,draw,opt={}){
  const wrap=el('div','viz'),cv=document.createElement('canvas');wrap.appendChild(cv);host.appendChild(wrap);
  const ctx=cv.getContext('2d');let W=0,H=0;
  function size(){const w=Math.max(200,wrap.clientWidth||320);const dpr=Math.min(3,window.devicePixelRatio||1);W=w;H=typeof h==='function'?Math.round(h(w)):h;cv.width=Math.round(w*dpr);cv.height=Math.round(H*dpr);cv.style.width=w+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  function redraw(){if(!W)size();ctx.clearRect(0,0,W,H);draw(ctx,W,H);}
  let lastW=-1;
  const ro=new ResizeObserver(()=>{const w=wrap.clientWidth;if(w!==lastW){lastW=w;size();redraw();}});ro.observe(wrap);live.push(()=>ro.disconnect());
  if(opt.onTap){wrap.style.cursor='pointer';wrap.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();opt.onTap(e.clientX-r.left,e.clientY-r.top,W,H);});}
  return {wrap,redraw,get W(){return W},get H(){return H}};
}
function chips(host,names,active,onSel){
  const box=el('div','chips');const bs=names.map((n,k)=>{const b=el('button','chip'+(k===active?' on':''),n);b.onclick=()=>{set(k);onSel(k);};box.appendChild(b);return b;});
  function set(k){bs.forEach((b,i)=>b.classList.toggle('on',i===k));}
  host.appendChild(box);return {set};
}
function slider(host,label,min,max,step,val,onIn,f=v=>v){
  const w=el('div','sl');const lb=el('label',null,`<span>${label}</span><b>${f(val)}</b>`);const r=el('input');r.type='range';r.min=min;r.max=max;r.step=step;r.value=val;
  r.oninput=()=>{lb.querySelector('b').textContent=f(+r.value);onIn(+r.value);};w.append(lb,r);host.appendChild(w);return r;
}
function ctrlBtn(host,label,fn,pri){const b=el('button','cbtn'+(pri?' pri':''),label);b.onclick=fn;host.appendChild(b);return b;}
function legend(host,items){const d=el('div','legend');items.forEach(([c,t])=>{d.appendChild(el('span',null,`<i style="background:${c}"></i>${t}`));});host.appendChild(d);}

/* ============ drawing primitives ============ */
function gridGeom(W,H){const pad=22;const s=Math.floor(Math.min((W-pad-10)/6,(H-pad-6)/6));const gw=s*6;const x0=Math.round((W-gw+pad)/2);return {s,x0,y0:pad};}
function diceHit(W,H,x,y){const g=gridGeom(W,H);const i=Math.floor((x-g.x0)/g.s)+1,j=Math.floor((y-g.y0)/g.s)+1;return(i>=1&&i<=6&&j>=1&&j<=6)?[i,j]:null;}
function drawDice(ctx,W,H,o={}){
  const g=gridGeom(W,H),s=g.s;
  for(let i=1;i<=6;i++){T(ctx,i,g.x0+(i-.5)*s,g.y0-10,{s:11,c:C.muted});T(ctx,i,g.x0-11,g.y0+(i-.5)*s,{s:11,c:C.muted});}
  for(let i=1;i<=6;i++)for(let j=1;j<=6;j++){
    const x=g.x0+(i-1)*s,y=g.y0+(j-1)*s;const a=o.A&&o.A(i,j),b=o.B&&o.B(i,j),f=o.fade&&o.fade(i,j);
    ctx.globalAlpha=f?.14:1;rr(ctx,x+1.5,y+1.5,s-3,s-3,5);ctx.fillStyle=a?acc(.85):b?slate(.42):C.grid;ctx.fill();
    if(a&&b){ctx.lineWidth=3;ctx.strokeStyle=C.b;ctx.stroke();}
    if(o.hl&&o.hl(i,j)){ctx.save();rr(ctx,x+1.5,y+1.5,s-3,s-3,5);ctx.clip();hatch(ctx,x,y,s,s);ctx.restore();rr(ctx,x+1.5,y+1.5,s-3,s-3,5);ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();}
    const lab=o.label?o.label(i,j):(o.sums?i+j:null);
    if(lab!=null)T(ctx,lab,x+s/2,y+s/2+.5,{s:Math.max(9,Math.min(14,s*.32)),w:600,c:a?C.ink:C.muted});
    ctx.globalAlpha=1;
  }
}
function vennG(W,H,o={}){const ux=8,uy=8,uw=W-16,uh=H-16;const r=Math.min(uh*.37,uw*(o.disjoint?.17:.21));const d=o.disjoint?r*2.6:r*1.15;const cy=uy+uh/2+6;return{ux,uy,uw,uh,A:{x:W/2-d/2,y:cy,r},B:{x:W/2+d/2,y:cy,r},d};}
function clipC(ctx,g,c,inside){ctx.beginPath();if(!inside)ctx.rect(g.ux-2,g.uy-2,g.uw+4,g.uh+4);ctx.moveTo(c.x+c.r,c.y);ctx.arc(c.x,c.y,c.r,0,TAU);ctx.clip(inside?'nonzero':'evenodd');}
function region(ctx,g,reg,fn){ctx.save();ctx.beginPath();ctx.rect(g.ux,g.uy,g.uw,g.uh);ctx.clip();clipC(ctx,g,g.A,reg==='A'||reg==='AB');clipC(ctx,g,g.B,reg==='B'||reg==='AB');fn();ctx.restore();}
function drawVenn(ctx,W,H,o={}){
  const g=vennG(W,H,o);
  rr(ctx,g.ux,g.uy,g.uw,g.uh,12);ctx.fillStyle='#12161c';ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.stroke();
  (o.shade||[]).forEach(r=>region(ctx,g,r,()=>{ctx.fillStyle=acc(.62);ctx.fillRect(0,0,W,H);}));
  (o.hl||[]).forEach(r=>region(ctx,g,r,()=>{ctx.fillStyle=acc(.95);ctx.fillRect(0,0,W,H);hatch(ctx,0,0,W,H);}));
  [['A',g.A],['B',g.B]].forEach(([n,c])=>{ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.lineWidth=(o.thick===n)?3.5:1.6;ctx.strokeStyle=(o.thick===n)?'#fff':'rgba(232,234,240,.75)';ctx.stroke();
    T(ctx,n,c.x+(n==='A'?-1:1)*c.r*.78,c.y-c.r*.86,{s:16,w:700,a:n==='A'?'right':'left'});});
  T(ctx,'S',g.ux+14,g.uy+14,{s:12,w:600,c:C.muted});
  if(o.vals){const v=o.vals,r=g.A.r;const pos={A:[o.disjoint?g.A.x:g.A.x-r*.42,g.A.y],B:[o.disjoint?g.B.x:g.B.x+r*.42,g.B.y],AB:[(g.A.x+g.B.x)/2,g.A.y],N:[g.ux+g.uw-26,g.uy+g.uh-16]};
    for(const k in v)if(pos[k])T(ctx,v[k],pos[k][0],pos[k][1],{s:14,w:700,c:'#fff'});}
}
function drawMosaic(ctx,W,H,o){
  const top=30,bot=o.bot||8;const s=Math.min(W-70,H-top-bot);const x0=(W-s)/2+(o.shift||0),y0=top;
  ctx.fillStyle='#1b2029';ctx.fillRect(x0,y0,s,s);let x=x0;
  o.cols.forEach(c=>{const w=c.w*s,hh=c.h*s;ctx.fillStyle=acc(.72);ctx.fillRect(x,y0+s-hh,w,hh);
    if(c.hl){ctx.save();ctx.beginPath();ctx.rect(x,y0+s-hh,w,hh);ctx.clip();hatch(ctx,x,y0+s-hh,w,hh);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.strokeRect(x+1.5,y0+s-hh+1.5,w-3,hh-3);}
    T(ctx,c.label,x+w/2,y0-17,{s:12,w:650,c:C.text});T(ctx,c.w,x+w/2,y0-5,{s:10,c:C.muted});
    if(o.vals!==false&&hh>16&&w>26)T(ctx,c.note||c.h,x+w/2,y0+s-hh/2,{s:c.note?11:12,w:700,c:C.ink});
    if(o.vals!==false&&hh<=16&&w>26)T(ctx,c.note||c.h,x+w/2,y0+s-hh-9,{s:11,w:700,c:C.text});
    x+=w;ctx.strokeStyle=C.bg;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y0+s);ctx.stroke();});
  ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.strokeRect(x0,y0,s,s);
  if(o.dash){ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;let xx=x0;o.cols.forEach(c=>{const w=c.w*s;ctx.beginPath();ctx.moveTo(x0,y0+s-c.h*s);ctx.lineTo(x0+s,y0+s-c.h*s);ctx.stroke();xx+=w;});ctx.restore();}
  if(o.yLabel)T(ctx,o.yLabel,x0-8,y0+s-12,{s:12,w:650,a:'right',c:C.acc});
  return {x0,y0,s};
}
function axes(ctx,W,H,o){

function cdfOf(sh){const N=600,xs=[],cs=[];let c=0,prev=sh.f(sh.x0);for(let k=0;k<=N;k++){const x=sh.x0+(sh.x1-sh.x0)*k/N;const y=sh.f(x);if(k)c+=(y+prev)/2*(sh.x1-sh.x0)/N;prev=y;xs.push(x);cs.push(c);}return x=>{if(x<=sh.x0)return 0;if(x>=sh.x1)return cs[N];const k=Math.round((x-sh.x0)/(sh.x1-sh.x0)*N);return cs[k];};}

const SRC={
  Flat:{x0:0,x1:1,f:()=>1,ymax:1.6,s:()=>Math.random(),mu:.5,sd:Math.sqrt(1/12),xt:[0,.5,1]},
  Skewed:{x0:0,x1:4,f:x=>Math.exp(-x),ymax:1.1,s:()=>-Math.log(1-Math.random()),mu:1,sd:1,xt:[0,1,2,3,4]},
  Die:{x0:.5,x1:6.5,disc:[1,2,3,4,5,6],ymax:.3,s:()=>1+Math.floor(Math.random()*6),mu:3.5,sd:Math.sqrt(35/12),xt:[1,2,3,4,5,6]}
};
function cltWidget(h){
  let name='Skewed',n=5,means=[],lastS=[],bell=true,auto=false,src=SRC[name];const BINS=48;
  const v1=mkCanvas(h,130,(ctx,W,H)=>{let A;
    if(src.disc){A=axes(ctx,W,H,{x0:src.x0,x1:src.x1,y0:0,y1:src.ymax,xt:src.xt,t:22});src.disc.forEach(x=>{const y=A.Y(1/6);rr(ctx,A.X(x)-10,y,20,A.Y(0)-y,3);ctx.fillStyle=slate(.55);ctx.fill();});}
    else{A=axes(ctx,W,H,{x0:src.x0,x1:src.x1,y0:0,y1:src.ymax,xt:src.xt,t:22});areaPath(ctx,A,src.f,src.x0,src.x1);ctx.fillStyle=slate(.35);ctx.fill();strokeFn(ctx,A,src.f,src.x0,src.x1,C.b,1.8);}
    lastS.forEach((x,i)=>{ctx.beginPath();ctx.arc(A.X(Math.min(src.x1,x)),A.Y(0)-5-(i%3)*6,3.2,0,TAU);ctx.fillStyle='#fff';ctx.fill();});
    if(lastS.length){const m=lastS.reduce((a,b)=>a+b,0)/lastS.length;ctx.fillStyle=C.acc;ctx.beginPath();ctx.moveTo(A.X(m),A.Y(0)+2);ctx.lineTo(A.X(m)-6,A.Y(0)+12);ctx.lineTo(A.X(m)+6,A.Y(0)+12);ctx.fill();}
    T(ctx,'Population shape. White dots: your latest sample of '+n,A.l,10,{a:'left',s:11,c:C.muted});});
  const v2=mkCanvas(h,220,(ctx,W,H)=>{const bw=(src.x1-src.x0)/BINS;const cnt=Array(BINS).fill(0);means.forEach(m=>{const k=Math.min(BINS-1,Math.max(0,Math.floor((m-src.x0)/bw)));cnt[k]++;});
    const dens=cnt.map(c=>means.length?c/(means.length*bw):0);const se=src.sd/Math.sqrt(n);const peak=1/(se*Math.sqrt(TAU));const ymax=Math.max(peak*1.15,Math.max(...dens)*1.1,.5);
    const A=axes(ctx,W,H,{x0:src.x0,x1:src.x1,y0:0,y1:ymax,xt:src.xt,t:22});
    dens.forEach((d,k)=>{if(!d)return;const x=A.X(src.x0+k*bw),w=A.X(src.x0+(k+1)*bw)-x;const y=A.Y(d);ctx.fillStyle=acc(.75);ctx.fillRect(x+.5,y,w-1,A.Y(0)-y);});
    if(bell)strokeFn(ctx,A,x=>Math.exp(-(((x-src.mu)/se)**2)/2)/(se*Math.sqrt(TAU)),src.x0,src.x1,'#fff',1.8,[5,4]);
    T(ctx,`Pile of sample means (${means.length})`,A.l,10,{a:'left',s:11,c:C.muted});});
  function draw(k){for(let i=0;i<k;i++){lastS=[];for(let j=0;j<n;j++)lastS.push(src.s());means.push(lastS.reduce((a,b)=>a+b,0)/n);}v1.redraw();v2.redraw();}
  function reset(){means=[];lastS=[];v1.redraw();v2.redraw();}
  chips(h,Object.keys(SRC),1,k=>{name=Object.keys(SRC)[k];src=SRC[name];reset();});
  slider(h,'Sample size n',1,40,1,n,x=>{n=x;reset();});
  const c=el('div','ctrls');h.appendChild(c);ctrlBtn(c,'Draw 1 sample',()=>draw(1),true);ctrlBtn(c,'+100',()=>draw(100));
  const ab=ctrlBtn(c,'Auto',()=>{auto=!auto;ab.textContent=auto?'Stop':'Auto';if(auto)loop();});ctrlBtn(c,'Reset',reset);
  let to;function loop(){if(!auto)return;draw(3);to=setTimeout(loop,60);}live.push(()=>{auto=false;clearTimeout(to);});
  const bc=chips(h,['Bell curve overlay'],0,()=>{bell=!bell;bc.set(bell?0:-1);v2.redraw();});
}

const BASE={Symmetric:z=>Math.exp(-z*z/2)/Math.sqrt(TAU),'Right-skewed':z=>{const u=z+2;return u>0?u*Math.exp(-u):0;},'Two humps':z=>.5*(Math.exp(-(((z+1.5)/.6)**2)/2)+Math.exp(-(((z-1.5)/.6)**2)/2))/(.6*Math.sqrt(TAU))};
function shapeWidget(h){
  let name='Right-skewed',c=0,s=1;const cap=el('div','cap');
  const v=mkCanvas(h,240,(ctx,W,H)=>{const g=BASE[name];const f=x=>g((x-c)/s)/s;let m=0,m2=0,tot=0,mode=0,mv=0;const N=1200;for(let k=0;k<=N;k++){const x=-8+16*k/N,y=f(x);tot+=y;m+=x*y;m2+=x*x*y;if(y>mv){mv=y;mode=x;}}m/=tot;const sd=Math.sqrt(m2/tot-m*m);
    const A=drawCurve(ctx,W,H,{f,x0:-6,x1:6,ymax:.75,xt:[-6,-4,-2,0,2,4,6],yt:[0],fill:true,mean:m,meanLabel:'balance point = mean '+fmt(m,1)});
    const yb=A.Y(f(m))*.5+A.Y(0)*.5;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(A.X(m-sd),yb);ctx.lineTo(A.X(m+sd),yb);[m-sd,m+sd].forEach(x=>{ctx.moveTo(A.X(x),yb-6);ctx.lineTo(A.X(x),yb+6);});ctx.stroke();
    T(ctx,'±1 SD',A.X(m+sd)+6,yb,{a:'left',s:11,c:'#fff'});
    if(Math.abs(mode-m)>.15){ctx.save();ctx.setLineDash([3,3]);ctx.strokeStyle=C.b;ctx.beginPath();ctx.moveTo(A.X(mode),A.Y(mv));ctx.lineTo(A.X(mode),A.Y(0));ctx.stroke();ctx.restore();T(ctx,'peak',A.X(mode),A.Y(mv)-9,{s:11,c:C.b});}
    cap.innerHTML=`Mean <b>${fmt(m,2)}</b> sits where the shape would balance. SD <b>${fmt(sd,2)}</b>, variance <b>${fmt(sd*sd,2)}</b>.`;});
  h.appendChild(cap);chips(h,Object.keys(BASE),1,k=>{name=Object.keys(BASE)[k];v.redraw();});
  slider(h,'Shift',-2.5,2.5,.1,c,x=>{c=x;v.redraw();},x=>x.toFixed(1));
  slider(h,'Spread (widen / narrow)',.5,2,.05,s,x=>{s=x;v.redraw();},x=>x.toFixed(2));
}

  mc('X is spread evenly over [0, 4], density 0.25. Shaded: 1 ≤ X ≤ 2. Area?',(c,W,H,hl)=>{const A=drawCurve(c,W,H,{f:uni,x0:-.5,x1:4.5,ymax:.4,shade:[1,2],hl:hl?[1,2]:null,xt:[0,1,2,3,4],yt:[0,.25]});if(hl){T(c,'width 1',A.X(1.5),A.Y(0)-10,{s:11,w:700,c:C.ink});T(c,'height 0.25',A.X(2)+6,A.Y(.25)-10,{a:'left',s:11,w:700,c:'#fff'});}},['0.25','1','0.5','0.2'],0,'A rectangle 1 wide and 0.25 tall. Area 0.25.',{h:200}),
  mc('This is the CDF of the PMF from before. Read P(X ≤ 2).',(c,W,H,hl)=>{const A=axes(c,W,H,{x0:-1,x1:5,y0:0,y1:1.05,yt:[0,.3,.7,1],xt:[0,1,2,3,4]});const ps=[.1,.2,.4,.2,.1];let cu=0;c.strokeStyle='#e3e7ef';c.lineWidth=2.2;c.beginPath();c.moveTo(A.X(-1),A.Y(0));ps.forEach((p,i)=>{c.lineTo(A.X(i),A.Y(cu));cu+=p;c.lineTo(A.X(i),A.Y(cu));});c.lineTo(A.X(5),A.Y(1));c.stroke();
      if(hl){c.save();c.setLineDash([4,3]);c.strokeStyle=C.acc;c.beginPath();c.moveTo(A.X(2),A.Y(0));c.lineTo(A.X(2),A.Y(.7));c.lineTo(A.l,A.Y(.7));c.stroke();c.restore();c.beginPath();c.arc(A.X(2),A.Y(.7),5,0,TAU);c.fillStyle=C.acc;c.fill();}},['0.4','0.7','0.3','1'],1,'At x = 2 the staircase has already jumped three times: 0.1 + 0.2 + 0.4 = 0.7. That is the height there.',{h:210}),
  mc('Which bar chart is a valid PMF?',(c,W,H,hl)=>{c.fillStyle=C.muted;T(c,'Bar heights are labeled. Pick the one that could be a PMF.',W/2,H/2,{s:13,c:C.muted});},[0,1,2].map(k=>({draw:(c,W,H)=>drawBars(c,W,H,{xs:[0,1,2],ps:[[.2,.5,.3],[.3,.5,.4],[.6,-.1,.5]][k],ymax:.7,vals:true,zero:true,l:8,t:18})})),0,'Probabilities can’t be negative and must add to 1. Only 0.2 + 0.5 + 0.3 = 1 works. The middle one adds to 1.2.',{h:60,pics:true}),
  mc('400 measurements, binned. Which PDF shape matches?',(c,W,H,hl)=>drawBars(c,W,H,{xs:EXPH.map((_,i)=>i),ps:EXPH.map(x=>x/400),ymax:.4,yt:[0,.2,.4],xf:i=>i%2?'':fmt(i*.5),hl:hl?[0,1,2]:[]}),[0,1,2].map(k=>({draw:(c,W,H)=>{const fs=[x=>Math.exp(-x),x=>Math.exp(-((x-2)**2)*2),x=>(x>=0&&x<=4)?.5:0];const A=axes(c,W,H,{x0:0,x1:4,y0:0,y1:1.1,l:6,r:6,t:6,b:8});areaPath(c,A,fs[k],0,4);c.fillStyle=acc(.25);c.fill();strokeFn(c,A,fs[k],0,4,'#e3e7ef',2);}})),0,'The tallest bins are on the far left and they keep shrinking to the right. That is the decaying shape.',{h:180,pics:true}),
  mc('X has a bell-shaped PDF. What is P(X = exactly 1.5)?',(c,W,H,hl)=>{const f=x=>Math.exp(-x*x/2)/Math.sqrt(TAU);const A=drawCurve(c,W,H,{f,x0:-3.5,x1:3.5,ymax:.45,fill:true,xt:[-3,-2,-1,0,1,2,3],yt:[0]});c.strokeStyle=hl?C.acc:'#fff';c.lineWidth=hl?3:1.5;c.beginPath();c.moveTo(A.X(1.5),A.Y(0));c.lineTo(A.X(1.5),A.Y(f(1.5)));c.stroke();if(hl)T(c,'width 0 → area 0',A.X(1.5)+8,A.Y(f(1.5))-12,{a:'left',s:12,w:700,c:C.acc});},['f(1.5) ≈ 0.13','0','0.5','Can’t tell'],1,'A single point is a line with no width, so it has no area. For a continuous X every exact value has probability 0. The curve height is a density, not a probability.',{h:200}),
  mc('X is uniform on [0, 4]. Which picture is its CDF?',(c,W,H,hl)=>drawCurve(c,W,H,{f:uni,x0:-.5,x1:4.5,ymax:.4,fill:true,xt:[0,1,2,3,4],yt:[0,.25]}),[0,1,2].map(k=>({draw:(c,W,H)=>{const fs=[x=>Math.max(0,Math.min(1,x/4)),x=>1/(1+Math.exp(-3*(x-2))),x=>x<2?0:1];const A=axes(c,W,H,{x0:-.5,x1:4.5,y0:0,y1:1.1,l:6,r:6,t:6,b:8});strokeFn(c,A,fs[k],-.5,4.5,'#e3e7ef',2.4);}})),0,'Flat density means the area grows at a constant rate, so the CDF is a straight ramp from 0 at x = 0 to 1 at x = 4.',{h:180,pics:true}),
  formula('Now the definitions',[
    {f:'PMF:  p(x) = P(X = x),  Σ p(x) = 1',n:'Bar heights. Non-negative, total 1.'},
    {f:'PDF:  P(a ≤ X ≤ b) = ∫ₐᵇ f(x) dx',n:'Area under the curve. P(X = c) = 0.'},
    {f:'CDF:  F(x) = P(X ≤ x)',n:'Staircase for discrete, smooth climb for continuous. F′(x) = f(x).'},
    {f:'E[X] = Σ x p(x)   or   ∫ x f(x) dx',n:'The balance point marker. More in the next lesson.'}])
];

const TRACKS=[
  {sub:'Track 1',title:'Probability Foundations',lessons:[['t1l1','Sample spaces & events'],['t1l2','Counting: permutations & combinations'],['t1l3','Conditional probability'],['t1l4','Independence'],['t1l5','Total probability'],['t1l6','Bayes’ rule with icon arrays']]},
  {sub:'Track 2',title:'Random Variables',lessons:[['t2l1','PMF, PDF, and CDF'],['t2l2','Expectation'],['t2l3','Variance'],['t2l4','Bernoulli & binomial'],['t2l5','Poisson'],['t2l6','Uniform & exponential'],['t2l7','The Gaussian']]},
  {sub:'Track 3',title:'Joint Distributions & Limit Theorems',lessons:[['t3l1','Joint PMFs & PDFs'],['t3l2','Covariance & correlation'],['t3l3','Sums of random variables'],['t3l4','Law of large numbers'],['t3l5','Central limit theorem'],['t3l6','Intro to estimation']]}
];
const ORDER=TRACKS.flatMap(t=>t.lessons.map(l=>l[0])).filter(id=>LESSONS[id]);
const TITLE={};TRACKS.forEach(t=>t.lessons.forEach(([id,ti])=>TITLE[id]=ti));

/* ============ state ============ */
const KEY='ece109.progress.v1';
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){S={};}S=Object.assign({xp:0,done:{},streak:0,last:null,freezes:1,wrong:[],unlockAll:false},S);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayNum=k=>{const[y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
function shownStreak(){if(!S.last)return 0;const gap=dayNum(dayKey())-dayNum(S.last)-1;if(gap<=0)return S.streak;return gap<=S.freezes?S.streak:0;}
function recordDay(){const t=dayKey();const r={newDay:false,used:0,earned:false};if(S.last===t)return r;r.newDay=true;
  if(!S.last)S.streak=1;else{const gap=dayNum(t)-dayNum(S.last)-1;if(gap<=0)S.streak++;else if(gap<=S.freezes){S.freezes-=gap;r.used=gap;S.streak++;}else S.streak=1;}
  S.last=t;if(S.streak%7===0&&S.freezes<3){S.freezes++;r.earned=true;}return r;}
function status(id){if(!LESSONS[id])return'soon';if(S.done[id])return'done';const i=ORDER.indexOf(id);const unlocked=S.unlockAll||i===0||S.done[ORDER[i-1]];if(!unlocked)return'locked';const first=ORDER.find(x=>!S.done[x]);return first===id?'current':'open';}

/* ============ icons ============ */
const IC={
  flame:'<svg viewBox="0 0 24 24" fill="#4fd1b5"><path d="M12 2c1 3.5 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
  ice:'<svg viewBox="0 0 24 24" fill="none" stroke="#8fa3c7" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg>',
  xp:'<svg viewBox="0 0 24 24" fill="#e8eaf0"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="#e8eaf0" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="#e8eaf0" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="#e8eaf0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#06231d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="#4b5262" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};

/* ============ screens ============ */
function topBar(){
  const t=el('div','top');t.innerHTML=`<div class="brand">ECE 109<small>Probability & Statistics</small></div>
  <div class="pill" title="Day streak">${IC.flame}${shownStreak()}</div><div class="pill" title="Streak freezes">${IC.ice}${S.freezes}</div><div class="pill" title="XP">${IC.xp}${S.xp}</div>`;
  const g=el('button','iconbtn',IC.gear);g.setAttribute('aria-label','Settings');g.onclick=settings;t.appendChild(g);return t;
}
function home(){
  cleanup();app.innerHTML='';window.scrollTo(0,0);app.appendChild(topBar());const m=el('div','main');app.appendChild(m);
  const td=S.last===dayKey();const tdy=el('div','today'+(td?' done':''));
  tdy.innerHTML=`<div class="dot"></div><p>${td?'<b>Today counts.</b> Anything else is extra.':'<b>One lesson today</b> keeps the streak going. Missed days get covered by freezes, nothing piles up.'}</p>`;m.appendChild(tdy);
  const r=el('div','row2');const rv=el('button','tile',`<b>Review</b><span>${S.wrong.length?S.wrong.length+' to revisit':'Nothing to revisit yet'}</span>`);rv.onclick=startReview;
  const lb=el('button','tile','<b>Labs</b><span>Dice roller, CLT sampler, shape explorer</span>');lb.onclick=labs;r.append(rv,lb);m.appendChild(r);
  TRACKS.forEach(tr=>{const sec=el('section','track');const built=tr.lessons.filter(l=>LESSONS[l[0]]).length;const dn=tr.lessons.filter(l=>S.done[l[0]]).length;
    sec.appendChild(el('div','trackhead',`<div><small>${tr.sub}</small><h2>${tr.title}</h2></div><span class="count">${built?dn+' / '+tr.lessons.length:'coming soon'}</span>`));
    const path=el('div','path');sec.appendChild(path);m.appendChild(sec);buildPath(path,tr.lessons);});
}
function buildPath(path,ls){
  const step=132,offs=[0,.6,.85,.45,-.2,-.65,-.85,-.4],W=path.clientWidth||340,amp=Math.min(80,W/2-80);path.style.height=(ls.length*step)+'px';
  const pts=ls.map((_,i)=>[W/2+offs[i%offs.length]*amp,38+i*step]);
  let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[c,e]=pts[i];d+=` C${a} ${b+56},${c} ${e-56},${c} ${e}`;}
  path.insertAdjacentHTML('beforeend',`<svg class="conn" viewBox="0 0 ${W} ${ls.length*step}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#2a303b" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/></svg>`);
  ls.forEach(([id,title],i)=>{const st=status(id);const n=el('div','node '+st);n.style.left=pts[i][0]+'px';n.style.top=(pts[i][1]-32)+'px';
    const inner=st==='done'?IC.check:st==='locked'?IC.lock:st==='soon'?'':(i+1);
    const b=el('button',null,`<div class="disc">${inner}</div><div class="lbl">${title}</div>${st==='soon'?'<div class="tag">soon</div>':''}`);
    b.disabled=st==='locked'||st==='soon';b.setAttribute('aria-label',title+' ('+st+')');b.onclick=()=>startLesson(id);n.appendChild(b);path.appendChild(n);});
}
let RUN;
function startLesson(id){RUN={id,steps:LESSONS[id].map((s,k)=>({...s,key:id+':'+k})),i:0,qs:0,first:0,review:false};renderStep();}
function startReview(){if(!S.wrong.length){cleanup();app.innerHTML='';app.appendChild(simpleHead('Review'));const m=el('div','main');m.appendChild(el('div','empty','<p>Nothing to revisit. Questions you miss in lessons will show up here so you can see them again.</p>'));app.appendChild(m);return;}
  const keys=S.wrong.slice().sort(()=>Math.random()-.5).slice(0,8);const steps=keys.map(k=>{const[id,ix]=k.split(':');const s=LESSONS[id]&&LESSONS[id][+ix];return s?{...s,key:k}:null;}).filter(Boolean);
  if(!steps.length){S.wrong=[];save();return home();}RUN={id:'review',steps,i:0,qs:0,first:0,review:true};renderStep();}
function simpleHead(t){const h=el('div','top');const b=el('button','iconbtn',IC.back);b.setAttribute('aria-label','Back');b.onclick=home;h.appendChild(b);h.appendChild(el('div','brand',t));return h;}
function renderStep(){
  cleanup();app.innerHTML='';window.scrollTo(0,0);const st=RUN.steps[RUN.i];
  const head=el('div','lhead');const x=el('button','iconbtn',IC.x);x.setAttribute('aria-label','Leave lesson');x.onclick=home;head.appendChild(x);
  const bar=el('div','bar','<i></i>');head.appendChild(bar);app.appendChild(head);requestAnimationFrame(()=>bar.firstChild.style.width=(100*RUN.i/RUN.steps.length)+'%');
  const body=el('div','lbody');app.appendChild(body);const foot=el('div','lfoot');app.appendChild(foot);
  const next=()=>{RUN.i++;RUN.i>=RUN.steps.length?finish():renderStep();};
  if(st.type==='explore'){body.appendChild(el('div','kicker',RUN.i===0?'Look first':'Explore'));const host=el('div');body.appendChild(host);st.build(host);
    body.appendChild(el('h3','ttl',st.title));body.appendChild(el('p','txt',st.body));const b=el('button','btn','Continue');b.onclick=next;foot.appendChild(b);}
  else if(st.type==='formula'){body.appendChild(el('div','kicker','Formula last'));body.appendChild(el('h3','ttl',st.title));
    st.lines.forEach(l=>{const f=el('div','formula');f.appendChild(el('div','f',l.f));f.appendChild(el('div','n',l.n));body.appendChild(f);});
    const b=el('button','btn','Finish lesson');b.onclick=next;foot.appendChild(b);}
  else renderMC(st,body,foot,next);
}
function renderMC(st,body,foot,next){
  RUN.qs++;let hl=false,sel=-1,checked=false;
  body.appendChild(el('div','kicker',RUN.review?'Review':'Question'));
  const v=mkCanvas(body,st.h||220,(c,W,H)=>st.draw(c,W,H,hl));if(st.legend)legend(body,st.legend);
  body.appendChild(el('div','prompt',st.prompt));
  const box=el('div','opts'+(st.pics?' pics':''));body.appendChild(box);
  const btns=st.options.map((o,k)=>{const b=el('button','opt');if(typeof o==='string')b.textContent=o;else{mkCanvas(b,74,o.draw);b.appendChild(el('small',null,'Option '+'ABC'[k]));}
    b.onclick=()=>{if(checked)return;sel=k;btns.forEach((x,i)=>x.classList.toggle('sel',i===k));cb.disabled=false;};box.appendChild(b);return b;});
  const cb=el('button','btn','Check');cb.disabled=true;foot.appendChild(cb);
  cb.onclick=()=>{if(checked){next();return;}checked=true;const ok=sel===st.ans;btns.forEach(b=>{b.disabled=true;b.classList.remove('sel');});btns[st.ans].classList.add('right');
    if(!ok){btns[sel].classList.add('picked');hl=true;v.redraw();if(!RUN.review&&!S.wrong.includes(st.key))S.wrong.push(st.key);}
    else{RUN.first++;if(RUN.review)S.wrong=S.wrong.filter(k=>k!==st.key);}
    save();
    const fb=el('div','fb'+(ok?' good':''),`<h4>${ok?pick(['Right.','Yes.','Exactly.','Correct.']):'Look at the highlighted part.'}</h4><p>${st.explain}</p>`);foot.insertBefore(fb,cb);
    cb.textContent='Continue';if(!ok)v.wrap.scrollIntoView({behavior:'smooth',block:'start'});};
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function finish(){
  cleanup();app.innerHTML='';window.scrollTo(0,0);const rev=RUN.review,first=!rev&&!S.done[RUN.id];
  const gain=rev?5+RUN.first:(first?10:5)+2*RUN.first;S.xp+=gain;if(!rev)S.done[RUN.id]=true;const r=recordDay();save();
  const d=el('div','done');d.innerHTML=`<svg class="check" viewBox="0 0 110 110"><circle class="ring" cx="55" cy="55" r="48"/><path class="tick" d="M33 57l15 15 30-32"/></svg>
  <h2>${rev?'Review done':'Lesson complete'}</h2><p class="note">${rev?'Questions you got right this time leave the review pile.':TITLE[RUN.id]}</p>
  <div class="stats"><div class="stat"><b>+${gain}</b><span>XP</span></div><div class="stat"><b>${RUN.first}/${RUN.qs}</b><span>first try</span></div><div class="stat"><b>${S.streak}</b><span>day streak</span></div></div>
  <p class="note">${r.used?`A freeze covered ${r.used===1?'a missed day':r.used+' missed days'}. `:''}${r.earned?'You earned a streak freeze. ':''}${!r.newDay?'Today already counted.':''}</p>`;
  const b=el('button','btn','Back to the path');b.style.marginTop='26px';b.onclick=home;d.appendChild(b);app.appendChild(d);
}
function labs(){
  cleanup();app.innerHTML='';window.scrollTo(0,0);app.appendChild(simpleHead('Labs'));const m=el('div','main');app.appendChild(m);
  const sec=(t,p,fn)=>{const s=el('div','labsec');s.appendChild(el('h3',null,t));s.appendChild(el('p',null,p));m.appendChild(s);fn(s);};
  sec('Coin and dice roller','Every roll lands in a bar. The dashed lines are the long-run heights. More rolls, closer fit.',h=>rollerWidget(h,{mode:'die',modes:['coin','die','sum2','coins2']}));
  sec('Sampling simulator','Draw n values from a lopsided population and average them. Pile up the averages. Even from a skewed or flat start, the pile turns into a bell, and it gets narrower as n grows. That is the central limit theorem.',cltWidget);
  sec('Balance point and spread','The teal triangle is the mean: where the shape would balance on a finger. On a skewed shape it slides toward the long tail and away from the peak. The spread slider widens and narrows the curve; the white bar is one SD each side.',shapeWidget);
}
function settings(){
  const sh=el('div','sheet');const p=el('div');sh.appendChild(p);sh.onclick=e=>{if(e.target===sh)sh.remove();};
  p.appendChild(el('h3',null,'Settings'));
  const r1=el('div','rowt','<div><b>Unlock all lessons</b><p>Skip ahead without finishing earlier ones.</p></div>');const sw=el('button','sw'+(S.unlockAll?' on':''));sw.setAttribute('aria-label','Unlock all lessons');sw.onclick=()=>{S.unlockAll=!S.unlockAll;save();sw.classList.toggle('on',S.unlockAll);home();document.body.appendChild(sh);};r1.appendChild(sw);p.appendChild(r1);
  const r2=el('div','rowt','<div><b>Streak rules</b><p>One lesson or review a day counts. Extra lessons do not bank days. Freezes cover missed days automatically. You get one at the start and another every 7-day streak, up to 3.</p></div>');p.appendChild(r2);
  const r3=el('div','rowt','<div><b>Reset progress</b><p>Clears XP, streak, completed lessons and review pile.</p></div>');let armed=false;const rb=el('button','cbtn','Reset');rb.onclick=()=>{if(!armed){armed=true;rb.textContent='Tap again';return;}try{localStorage.removeItem(KEY);}catch(e){}load();sh.remove();home();};r3.appendChild(rb);p.appendChild(r3);
  const cl=el('button','btn ghost','Close');cl.style.marginTop='16px';cl.onclick=()=>sh.remove();p.appendChild(cl);
  document.body.appendChild(sh);
}
let rT,lastIW=window.innerWidth;window.addEventListener('resize',()=>{if(window.innerWidth===lastIW)return;lastIW=window.innerWidth;clearTimeout(rT);rT=setTimeout(()=>{if(app.querySelector('.path'))home();},200);});
load();home();
</script>
